```html
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BIM Lite</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
}

#toolbar{
    position:absolute;
    top:10px;
    left:10px;
    z-index:100;
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

button{
    margin:3px;
    padding:8px;
    cursor:pointer;
}

#info{
    margin-top:10px;
    font-size:12px;
}
</style>
</head>

<body>

<div id="toolbar">

<h3>BIM Lite</h3>

<button onclick="addWall()">Tambah Wall</button>
<button onclick="addColumn()">Tambah Column</button>
<button onclick="exportModel()">Export JSON</button>

<div id="info">
Objek : <span id="count">0</span>
<br>
Volume : <span id="volume">0</span> m³
</div>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f5f5);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(20,20,20);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);

document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);

const grid = new THREE.GridHelper(100,100);
scene.add(grid);

const axes = new THREE.AxesHelper(5);
scene.add(axes);

const light1 = new THREE.DirectionalLight(0xffffff,2);
light1.position.set(20,20,20);
scene.add(light1);

const ambient = new THREE.AmbientLight(0xffffff,1);
scene.add(ambient);

let modelData = [];
let totalVolume = 0;

function updateInfo(){

document.getElementById("count").innerText =
modelData.length;

document.getElementById("volume").innerText =
totalVolume.toFixed(2);

}

window.addWall = function(){

const length = 5;
const height = 3;
const thickness = 0.15;

const geometry =
new THREE.BoxGeometry(length,height,thickness);

const material =
new THREE.MeshStandardMaterial({
color:0x888888
});

const wall =
new THREE.Mesh(geometry,material);

wall.position.set(
Math.random()*10-5,
height/2,
Math.random()*10-5
);

scene.add(wall);

const volume =
length*height*thickness;

totalVolume += volume;

modelData.push({
type:"Wall",
length:length,
height:height,
thickness:thickness,
volume:volume
});

updateInfo();

}

window.addColumn = function(){

const width = 0.4;
const depth = 0.4;
const height = 3;

const geometry =
new THREE.BoxGeometry(width,height,depth);

const material =
new THREE.MeshStandardMaterial({
color:0x0044ff
});

const column =
new THREE.Mesh(geometry,material);

column.position.set(
Math.random()*10-5,
height/2,
Math.random()*10-5
);

scene.add(column);

const volume =
width*depth*height;

totalVolume += volume;

modelData.push({
type:"Column",
width:width,
depth:depth,
height:height,
volume:volume
});

updateInfo();

}

window.exportModel = function(){

const data =
JSON.stringify(modelData,null,2);

const blob =
new Blob([data],{
type:"application/json"
});

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href = url;
a.download = "bim-model.json";
a.click();

}

function animate(){

requestAnimationFrame(animate);

renderer.render(scene,camera);

}

animate();

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>

</body>
</html>
```
