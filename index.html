<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<script src="login-gate.js" data-app="Octopus Studio"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Octopus Studio: alat bantu arsitek untuk pra-desain, pemodelan, RAB, dan gambar kerja rumah tinggal sederhana.">
<title>Octopus Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF0EB;--surface:#F9FAF7;--surface2:#F2F4EF;--ink:#1A1E1C;--muted:#5A625D;--faint:#8A928C;--rule:#D2D7CF;--rule2:#BCC3BA;
  --accent:#1F5C50;--accent-ink:#F4FAF7;--accent-soft:#DCE9E3;--mark:#C99400;--mark-soft:#F6E7B8;
  --ok:#2E7440;--ok-soft:#DDEEDF;--warn:#9A6212;--warn-soft:#F5E6CB;--bad:#A8352A;--bad-soft:#F6DCD8;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#111513;--surface:#181D1A;--surface2:#1E2420;--ink:#E3E8E3;--muted:#9BA49D;--faint:#6E7771;--rule:#2B332E;--rule2:#3A443E;
  --accent:#6DC2AE;--accent-ink:#0E1B17;--accent-soft:#1C332D;--mark:#EDC244;--mark-soft:#3A3219;
  --ok:#76C487;--ok-soft:#1B3222;--warn:#E3AC55;--warn-soft:#3A2D17;--bad:#E97E71;--bad-soft:#3D1F1B;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#111513;--surface:#181D1A;--surface2:#1E2420;--ink:#E3E8E3;--muted:#9BA49D;--faint:#6E7771;--rule:#2B332E;--rule2:#3A443E;
  --accent:#6DC2AE;--accent-ink:#0E1B17;--accent-soft:#1C332D;--mark:#EDC244;--mark-soft:#3A3219;
  --ok:#76C487;--ok-soft:#1B3222;--warn:#E3AC55;--warn-soft:#3A2D17;--bad:#E97E71;--bad-soft:#3D1F1B;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* title block */
.tb{display:grid;grid-template-columns:minmax(180px,1.4fr) repeat(4,minmax(110px,1fr));border:1.5px solid var(--ink);background:var(--surface)}
.tb>div{padding:8px 12px;border-left:1px solid var(--rule2);min-width:0}
.tb>div:first-child{border-left:0}
.tb .k{font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tb .v{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .brand{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.02em;line-height:1.1}
.tb .brand small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.tb button.v{background:none;border:0;padding:0;cursor:pointer;text-align:left;width:100%}
@media (max-width:820px){.tb{grid-template-columns:1fr 1fr}.tb>div{border-left:0;border-top:1px solid var(--rule2)}.tb>div:first-child{grid-column:1/-1;border-top:0}}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

/* sidebar */
.side{background:var(--surface);border:1px solid var(--rule);display:flex;flex-direction:column}
.side h2{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0;padding:10px 12px;border-bottom:1px solid var(--rule);color:var(--muted)}
.plist{display:flex;flex-direction:column;max-height:420px;overflow:auto}
.pitem{all:unset;cursor:pointer;padding:9px 12px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:1px}
.pitem:hover{background:var(--surface2)}
.pitem[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.pitem b{font-weight:500}
.pitem span{font-size:12px;color:var(--muted)}
.side .foot{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.savestate{font-size:12px;color:var(--muted)}

/* tabs */
.tabs{display:flex;gap:0;border-bottom:1.5px solid var(--ink);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:9px 14px 8px;display:flex;align-items:baseline;gap:8px;white-space:nowrap;color:var(--muted);border:1px solid transparent;border-bottom:0;margin-bottom:-1.5px}
.tab .n{font-family:var(--mono);font-size:11px}
.tab .t{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.03em}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface);border-color:var(--ink);border-bottom:1.5px solid var(--surface)}
.tab:focus-visible{outline:2px solid var(--accent)}

.main{display:flex;flex-direction:column;gap:0;min-width:0}
.panel{background:var(--surface);border:1px solid var(--rule);border-top:0;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px}
.panel.single{grid-template-columns:1fr}
.panel.dokp{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}
@media (max-width:1080px){.panel,.panel.dokp{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:1080px){.sticky{position:static}}

.sec{display:flex;flex-direction:column;gap:10px}
.sec>h3{margin:0;font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.sec>h3::after{content:"";flex:1;height:1px;background:var(--rule)}
.hint{font-size:12.5px;color:var(--muted);margin:0;max-width:62ch}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.grid.g2{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:12px;color:var(--muted)}
label.f>span em{font-style:normal;color:var(--faint)}
input[type=text],input:not([type]),select,textarea{width:100%;background:var(--bg);border:1px solid var(--rule2);border-radius:3px;padding:7px 9px;min-width:0}
textarea{min-height:60px;resize:vertical}
input.num{text-align:right}
.unit{position:relative}
.unit input{padding-right:34px}
.unit i{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--faint);pointer-events:none;font-family:var(--mono)}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}

.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;border-left:1px solid var(--rule2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.btn{cursor:pointer;border:1px solid var(--rule2);background:var(--surface);padding:7px 12px;border-radius:3px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--bad);border-color:transparent}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ai{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 5px;border:1px solid currentColor;border-radius:2px;letter-spacing:.05em}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--rule)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px;color:var(--muted);text-align:left;padding:7px 8px;background:var(--surface2);border-bottom:1px solid var(--rule)}
td{padding:4px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
td input,td select{padding:5px 7px;background:transparent;border-color:transparent}
td input:hover,td select:hover{border-color:var(--rule2)}
td input:focus,td select:focus{background:var(--bg);border-color:var(--rule2)}
td.lbl{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--muted);padding-left:10px}
tfoot td{font-weight:500;background:var(--surface2)}
th.r,td.r{text-align:right}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:2px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.sun{background:var(--mark-soft);color:var(--warn)}

/* drawing */
.sheet{border:1px solid var(--ink);background:var(--surface)}
.sheet .cap{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--ink);padding:6px 10px;font-size:12px;flex-wrap:wrap}
.sheet .cap b{font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.sheet svg{display:block;width:100%;height:auto}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border:1px solid var(--rule);border-top:0}
.readout div{padding:8px 10px;border-left:1px solid var(--rule)}
.readout div:first-child{border-left:0}
.readout span{display:block;font-size:11.5px;color:var(--muted)}
.readout b{font-family:var(--mono);font-weight:500;font-size:15px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--rule)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}

/* checks */
.checks{display:flex;flex-direction:column;border:1px solid var(--rule)}
.ck{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:9px 10px;border-top:1px solid var(--rule);align-items:start}
.ck:first-child{border-top:0}
.pill{font-family:var(--display);font-weight:600;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;text-align:center}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.na{background:var(--surface2);color:var(--faint)}
.ck b{font-weight:500;display:block}
.ck small{color:var(--muted);font-size:12.5px}
.tally{display:flex;gap:6px;flex-wrap:wrap}

.note{font-size:12.5px;padding:8px 10px;border:1px solid var(--rule);background:var(--surface2);color:var(--muted)}
.note.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.note.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.note.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.photo{border:1px solid var(--rule);display:flex;flex-direction:column}
.photo img{aspect-ratio:4/3;object-fit:cover;width:100%;max-width:100%;display:block;background:var(--surface2)}
.photo input{border:0;border-top:1px solid var(--rule);border-radius:0;font-size:12px}
.photo .btn{border:0;border-top:1px solid var(--rule);border-radius:0;justify-content:center;font-size:12px}

.report{border:1px solid var(--rule);padding:16px 18px;background:var(--bg);min-height:120px;overflow-wrap:anywhere}
.report h1,.report h2,.report h3{font-family:var(--display);font-weight:600;letter-spacing:.02em;margin:1em 0 .35em;text-wrap:balance}
.report h1{font-size:22px}.report h2{font-size:18px}.report h3{font-size:15.5px}
.report>:first-child{margin-top:0}
.report p,.report li{max-width:72ch}
.report table{margin:.6em 0}
.report td,.report th{padding:5px 8px;border:1px solid var(--rule)}
.report code{font-family:var(--mono);font-size:12.5px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h3{font-family:var(--display);font-size:22px;color:var(--ink);margin:0}
.opt{border:1px solid var(--rule2);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.opt.chosen{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.opthead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opthead select{width:auto;margin-left:auto}
.kbadge{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.04em}
.cmd{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.cmd code{flex:1 1 240px;min-width:0;font-family:var(--mono);font-size:12px;background:var(--bg);border:1px dashed var(--rule2);padding:7px 9px;overflow-wrap:anywhere;color:var(--muted)}
.radios{display:flex;flex-direction:column;gap:6px}
details>summary{list-style-position:inside}
.confirm{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--bad);background:var(--bad-soft);font-size:13px}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.pitem{transition:background .12s,border-color .12s,color .12s}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* model */
.panel.modelp{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.mfull{grid-column:1/-1;min-width:0}
.mrow,.mtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mlab{font-size:12px;color:var(--muted)}
.mspace{flex:1}
.mtoolseg button{padding:6px 10px}
.mcv{position:relative;border:1.5px solid var(--ink);height:clamp(380px,64vh,640px);touch-action:none;overflow:hidden;background:var(--surface)}
.mcv canvas{position:absolute;left:0;top:0;display:block;cursor:crosshair}
.mstat{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:4px 2px;min-height:22px}
.m3bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.m3{position:relative;height:clamp(280px,40vh,420px);border:1px solid var(--rule2);background:var(--surface2);overflow:hidden}
.m3 canvas{position:absolute;left:0;top:0}
.mautod{border:1px solid var(--accent);background:var(--accent-soft)}
.mautod>summary{cursor:pointer;padding:8px 12px;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--accent)}
.mauto{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.mauto textarea{min-height:52px}
.drwlist{display:flex;flex-wrap:wrap;gap:6px}
.drwlist button{all:unset;cursor:pointer;font-size:12.5px;padding:5px 9px;border:1px solid var(--rule2);border-radius:3px;background:var(--surface)}
.drwlist button b{font-family:var(--mono);font-weight:500;margin-right:4px}
.drwlist button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.drwlist button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.drwprev{border:1px solid var(--rule2);background:#fff;aspect-ratio:420/297;overflow:hidden}
.drwprev svg{display:block;width:100%;height:100%}
.mprop{display:flex;flex-direction:column;gap:10px;border:1px solid var(--rule);padding:10px;background:var(--surface2)}
@media (max-width:1080px){.panel.modelp{grid-template-columns:minmax(0,1fr)}}
</style>

</head>

<script>
/* Octopus Studio versi publik: penyimpanan di peramban (localStorage) dengan API yang sama seperti db Studio */
window.OCTO=(function(){const K="octopus.v1.";const subs={};let ok=true;try{localStorage.setItem(K+"t","1");localStorage.removeItem(K+"t")}catch(e){ok=false}const mem={};
  const load=c=>{if(!ok)return mem[c]||{};try{return JSON.parse(localStorage.getItem(K+c)||"{}")}catch(e){return {}}};
  const save=(c,o)=>{if(!ok){mem[c]=o;return}try{localStorage.setItem(K+c,JSON.stringify(o))}catch(e){throw {code:"quota_exceeded"}}};
  const emit=c=>{const o=load(c);const snap={docs:Object.keys(o).map(id=>({id,data:()=>JSON.parse(JSON.stringify(o[id]))}))};(subs[c]||[]).forEach(f=>{try{f(snap)}catch(e){console.error(e)}})};
  const later=c=>setTimeout(()=>emit(c),0);
  const db={collection(c){return {onSnapshot(fn){(subs[c]=subs[c]||[]).push(fn);later(c);return ()=>{subs[c]=(subs[c]||[]).filter(x=>x!==fn)}}}},
    doc(p){const i=p.indexOf("/");const c=p.slice(0,i),id=p.slice(i+1);return {
      async get(){const o=load(c);return {exists:!!o[id],data:()=>o[id]}},
      async set(d){const o=load(c);o[id]=JSON.parse(JSON.stringify(d));save(c,o);later(c)},
      async update(d){const o=load(c);o[id]=Object.assign(o[id]||{},JSON.parse(JSON.stringify(d)));save(c,o);later(c)},
      async delete(){const o=load(c);delete o[id];save(c,o);later(c)}}}};
  const downloads={async save({filename,data}){const u=URL.createObjectURL(data);const a=document.createElement("a");a.href=u;a.download=filename||"unduhan";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}};
  return {db,downloads,persistent:ok,isEmpty:()=>Object.keys(load("projects")).length===0}})();
</script>

/* ---------- geometry ---------- */
function circInt(p0,r0,p1,r1){const dx=p1.x-p0.x,dy=p1.y-p0.y,d=Math.hypot(dx,dy);if(d<1e-9||d>r0+r1+1e-6||d<Math.abs(r0-r1)-1e-6)return null;const a=(r0*r0-r1*r1+d*d)/(2*d),h=Math.sqrt(Math.max(0,r0*r0-a*a));const xm=p0.x+a*dx/d,ym=p0.y+a*dy/d;return [{x:xm+h*dy/d,y:ym-h*dx/d},{x:xm-h*dy/d,y:ym+h*dx/d}]}
const cross=(a,b)=>a.x*b.y-a.y*b.x;
function shoelace(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a.x*b.y-b.x*a.y}return s/2}
function rawPoly(site){
  if(site.mode==="rect"){const w=num(site.rect.w),d=num(site.rect.d);if(!(w>0&&d>0))return {err:"Isi lebar dan panjang lahan."};return {pts:[{x:0,y:0},{x:w,y:0},{x:w,y:-d},{x:0,y:-d}]}}
  if(site.mode==="coords"){const pts=(site.coords||[]).map(c=>({x:num(c.x),y:num(c.y)})).filter(p=>p.x!==null&&p.y!==null);if(pts.length<3)return {err:"Isi minimal 3 titik koordinat."};return {pts}}
  const s=(site.sides||[]).map(num);const n=s.length;if(n<3)return {err:"Isi minimal 3 sisi."};
  if(s.some(v=>!(v>0)))return {err:"Semua panjang sisi harus diisi."};
  const dg=(site.diags||[]).map(num);
  for(let i=0;i<n-3;i++)if(!(dg[i]>0))return {err:"Isi diagonal "+LETTERS[0]+"–"+LETTERS[i+2]+" agar bentuk tapak pasti."};
  const P=[{x:0,y:0},{x:s[0],y:0}];
  for(let k=2;k<n;k++){const r=k<=n-2?dg[k-2]:s[n-1];const cand=circInt(P[0],r,P[k-1],s[k-1]);
    if(!cand)return {err:"Ukuran tidak bisa membentuk tapak di titik "+LETTERS[k]+". Cek sisi "+LETTERS[k-1]+"–"+LETTERS[k]+(k<=n-2?" dan diagonal A–"+LETTERS[k]:" dan sisi "+LETTERS[n-1]+"–A")+"."};
    const v=P[k-1];const pick=cand.find(c=>cross(v,c)<0)||cand[0];P.push(pick)}
  return {pts:P}}
function normPoly(pts,roadEdge){
  const n=pts.length;const e=Math.min(Math.max(0,roadEdge|0),n-1);const a=pts[e],b=pts[(e+1)%n];
  const cw=shoelace(pts)<0;const ang=Math.atan2(b.y-a.y,b.x-a.x);const rot=(cw?Math.PI:0)-ang;const c=Math.cos(rot),s=Math.sin(rot);
  let q=pts.map(p=>({x:p.x*c-p.y*s,y:p.x*s+p.y*c}));const mx=Math.min(...q.map(p=>p.x)),my=Math.min(...q.map(p=>p.y));q=q.map(p=>({x:p.x-mx,y:p.y-my}));
  return {pts:q,cw}}
function inwardNormal(a,b,cw){const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;return cw?{x:dy/L,y:-dx/L}:{x:-dy/L,y:dx/L}}
function inset(pts,cw,dist){
  const n=pts.length;const L=[];
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];const nn=inwardNormal(a,b,cw);const d=dist[i]||0;L.push({p:{x:a.x+nn.x*d,y:a.y+nn.y*d},u:{x:b.x-a.x,y:b.y-a.y}})}
  const out=[];
  for(let i=0;i<n;i++){const l1=L[(i-1+n)%n],l2=L[i];const den=cross(l1.u,l2.u);
    if(Math.abs(den)<1e-9){out.push(l2.p);continue}
    const t=cross({x:l2.p.x-l1.p.x,y:l2.p.y-l1.p.y},l2.u)/den;out.push({x:l1.p.x+l1.u.x*t,y:l1.p.y+l1.u.y*t})}
  for(let i=0;i<n;i++){const a=out[i],b=out[(i+1)%n];const u=L[i].u;if((b.x-a.x)*u.x+(b.y-a.y)*u.y<=1e-6)return null}
  const A=shoelace(out);if((cw&&A>=0)||(!cw&&A<=0))return null;return out}
function edgeRoles(pts,road){const n=pts.length;const a=pts[road],b=pts[(road+1)%n];let best=-1,bi=-1;
  for(let i=0;i<n;i++){if(i===road)continue;const m={x:(pts[i].x+pts[(i+1)%n].x)/2,y:(pts[i].y+pts[(i+1)%n].y)/2};const d=Math.abs(cross({x:b.x-a.x,y:b.y-a.y},{x:m.x-a.x,y:m.y-a.y}))/Math.hypot(b.x-a.x,b.y-a.y);if(d>best){best=d;bi=i}}
  return pts.map((_,i)=>i===road?"depan":(n>3&&i===bi?"belakang":"samping"))}
function heron(a,b,c){const s=(a+b+c)/2;const v=s*(s-a)*(s-b)*(s-c);return v>0?Math.sqrt(v):0}
function solveDiag(s,area){const[a,b,c,d]=s;const lo=Math.max(Math.abs(a-b),Math.abs(c-d))+1e-6,hi=Math.min(a+b,c+d)-1e-6;if(!(hi>lo))return null;
  const N=600;let best=null;const target=Math.hypot(a,b);let prev=null;
  for(let i=0;i<=N;i++){const e=lo+(hi-lo)*i/N;const g=heron(a,b,e)+heron(c,d,e)-area;if(prev&&Math.sign(g)!==Math.sign(prev.g)){let x0=prev.e,x1=e,g0=prev.g;for(let k=0;k<40;k++){const xm=(x0+x1)/2,gm=heron(a,b,xm)+heron(c,d,xm)-area;if(Math.sign(gm)===Math.sign(g0)){x0=xm;g0=gm}else x1=xm}const r=(x0+x1)/2;if(!best||Math.abs(r-target)<Math.abs(best-target))best=r}prev={e,g}}
  return best}

/* ---------- sun ---------- */
function sunPos(lat,n,hr){const R=Math.PI/180;const dec=23.44*Math.sin(2*Math.PI*(284+n)/365)*R;const h=15*(hr-12)*R;const phi=lat*R;
  const alt=Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(h));
  const az=Math.atan2(-Math.sin(h)*Math.cos(dec),Math.cos(phi)*Math.sin(dec)-Math.sin(phi)*Math.cos(dec)*Math.cos(h));
  return {alt:alt/R,az:((az/R)+360)%360}}

/* ---------- program ruang ---------- */
function genRooms(o,floors){
  const A=Math.max(0,o.adults|0),KM=o.kidsM|0,KF=o.kidsF|0,EL=o.elderly|0,HP=o.helper|0;const people=A+KM+KF+EL;
  const L2=floors>=2?2:1;const r=[];const add=(name,area,qty,floor,kind)=>{if(qty>0)r.push({name,area,qty,floor,kind})};
  add("Teras",6,1,1,"umum");
  add("Ruang tamu",o.guest?10:9,1,1,"umum");
  add("Ruang keluarga + makan",Math.min(26,Math.max(15,10+2*people)),1,1,"umum");
  add("Dapur",people>4?8:6,1,1,"servis");
  if(A>=1)add("Kamar tidur utama",12,1,L2,"kt");
  if(A>2)add("Kamar tidur dewasa",9,A-2,L2,"kt");
  const km=Math.ceil(KM/2),kf=Math.ceil(KF/2);
  if(km)add("Kamar tidur anak laki-laki",KM>=2?10:9,km,L2,"kt");
  if(kf)add("Kamar tidur anak perempuan",KF>=2?10:9,kf,L2,"kt");
  if(EL)add("Kamar tidur lansia",10,Math.ceil(EL/2),1,"kt");
  if(o.guest)add("Kamar tamu",9,1,1,"kt");
  if(HP)add("Kamar ART",6,Math.ceil(HP/2),1,"kt");
  if(people>=4&&A>=1)add("Kamar mandi dalam (KT utama)",4,1,L2,"km");
  add("Kamar mandi",3.5,1,1,"km");
  if(L2===2)add("Kamar mandi",3.5,1,2,"km");
  if(L2===1&&people>=5)add("Kamar mandi",3.5,1,1,"km");
  if(HP)add("Kamar mandi ART",2.5,1,1,"km");
  if(EL&&L2===1&&people<5)add("Kamar mandi dekat KT lansia",4,1,1,"km");
  if(o.work)add("Ruang kerja",8,1,L2,"umum");
  if(o.prayer)add("Musala",4,1,1,"umum");
  if(o.business)add("Ruang usaha",12,1,1,"umum");
  add("Cuci / jemur",people>4?6:5,1,L2,"servis");
  add("Gudang",3,1,1,"servis");
  if(L2===2){add("Tangga",6,1,1,"sirk");add("Tangga / hall",8,1,2,"sirk")}
  const car=(o.cars|0)*15+(o.motors|0)*2;if(car>0)add("Carport ("+(o.cars|0)+" mobil, "+(o.motors|0)+" motor)",car,1,1,"carport");
  return r}
function sumRooms(rooms,circ){const c=(num(circ)??15)/100;const fl={1:0,2:0};let car=0;
  for(const r of rooms){const a=(num(r.area)||0)*(num(r.qty)||0);if(r.kind==="carport")car+=a;else fl[r.floor==2?2:1]+=a}
  return {net1:fl[1],net2:fl[2],g1:fl[1]*(1+c),g2:fl[2]*(1+c),car}}

/* ---------- compute ---------- */
function compute(p){
  const d={};const s=p.site;
  const raw=rawPoly(s);d.err=raw.err||null;
  if(raw.pts){const n=raw.pts.length;const road=Math.min(s.roadEdge|0,n-1);const np=normPoly(raw.pts,road);d.pts=np.pts;d.cw=np.cw;d.n=n;d.road=road;
    d.area=Math.abs(shoelace(d.pts));d.lens=d.pts.map((a,i)=>{const b=d.pts[(i+1)%n];return Math.hypot(b.x-a.x,b.y-a.y)});d.perim=d.lens.reduce((x,y)=>x+y,0);
    d.roles=edgeRoles(d.pts,road);
    const F=num(s.frontAz)||0;d.F=F;
    d.edgeAz=d.pts.map((a,i)=>{const b=d.pts[(i+1)%n];const nn=inwardNormal(a,b,d.cw);const th=Math.atan2(-nn.x,-nn.y)*180/Math.PI;return ((th-180+F)%360+360)%360});
    const r=p.reg;const g={depan:num(r.gsbF)||0,samping:num(r.gsbS)||0,belakang:num(r.gsbR)||0};
    d.env=inset(d.pts,d.cw,d.roles.map(x=>g[x]));d.envArea=d.env?Math.abs(shoelace(d.env)):0;
  }
  const r=p.reg;const kdb=num(r.kdb),klb=num(r.klb),kdh=num(r.kdh);
  d.kdbA=d.area&&kdb!==null?d.area*kdb/100:null;d.klbA=d.area&&klb!==null?d.area*klb:null;d.kdhA=d.area&&kdh!==null?d.area*kdh/100:null;
  d.limit1=[d.kdbA,d.env?d.envArea:null].filter(v=>v!==null&&v>0);d.limit1=d.limit1.length?Math.min(...d.limit1):null;
  const o=p.occ;d.people=(o.adults|0)+(o.kidsM|0)+(o.kidsF|0)+(o.elderly|0)+(o.helper|0);
  const maxFl=num(r.maxFl)||2;
  if(o.floors==="1")d.floors=1;else if(o.floors==="2")d.floors=2;else{
    const t=sumRooms(genRooms(o,1),o.circ);d.floors=(d.limit1!==null&&t.g1+t.car>d.limit1&&maxFl>=2)?2:1}
  d.rooms=p.roomsAuto?genRooms(o,d.floors):(p.rooms||[]);
  if(!p.roomsAuto){d.floors=d.rooms.some(x=>x.floor==2)?2:1}
  const sm=sumRooms(d.rooms,o.circ);Object.assign(d,sm);d.gfa=sm.g1+sm.g2;
  d.gfaLimitBase=d.gfa+(o.carportIn?sm.car:0);
  d.cover=sm.g1+sm.car;
  d.perPerson=d.people?(sm.g1+sm.g2)/d.people:null;
  d.maxGfa=num(o.maxGfa)||200;
  d.checks=checks(p,d);
  return d}
function checks(p,d){const r=p.reg;const est=r.source==="perkiraan"?" Nilai aturan masih perkiraan.":"";const C=[];
  const push=(st,label,detail)=>C.push({st,label,detail});
  if(!d.pts){push("na","Bentuk tapak",d.err||"Ukuran tapak belum lengkap.");}
  const cert=num(p.site.certArea);
  if(d.pts){if(cert){const diff=(d.area-cert)/cert*100;push(Math.abs(diff)<=3?"ok":Math.abs(diff)<=7?"warn":"bad","Luas terhitung vs sertifikat",f(d.area,1)+" m² terhitung, "+f(cert,1)+" m² di sertifikat (selisih "+f(diff,1)+"%)."+(Math.abs(diff)>3?" Cek ulang ukuran sisi atau diagonal.":""))}
    else push("na","Luas terhitung vs sertifikat","Isi luas di sertifikat untuk membandingkan.")}
  const z=(r.zona||"").trim();
  if(!z)push("na","Peruntukan zona","Isi zona dari KRK/KKPR atau RDTR.");
  else if(/(^|\W)R[\s-]?\d|perumahan|hunian|permukiman/i.test(z))push("ok","Peruntukan zona","Zona "+z+" untuk hunian."+est);
  else push("warn","Peruntukan zona","Zona \""+z+"\" belum jelas untuk rumah tinggal. Pastikan ke Pemda.");
  push(d.gfaLimitBase<=d.maxGfa?"ok":"bad","Batas luas bangunan "+f(d.maxGfa,0)+" m²",f(d.gfaLimitBase,1)+" m²"+(p.occ.carportIn?" termasuk carport":" (carport tidak dihitung)")+"."+(d.gfaLimitBase>d.maxGfa?" Kurangi "+f(d.gfaLimitBase-d.maxGfa,1)+" m²: gabungkan ruang tamu dengan ruang keluarga, kecilkan sirkulasi, atau kurangi ruang tambahan.":""));
  if(d.perPerson!==null)push(d.perPerson>=9?"ok":"bad","Luas per penghuni",f(d.perPerson,1)+" m²/orang untuk "+d.people+" orang. Acuan rumah sederhana sehat sekitar 9 m²/orang.");
  const smallKt=d.rooms.filter(x=>x.kind==="kt"&&!/ART/.test(x.name)&&(num(x.area)||0)<9);
  if(d.rooms.some(x=>x.kind==="kt"))push(smallKt.length?"warn":"ok","Ukuran kamar tidur",smallKt.length?smallKt.map(x=>x.name).join(", ")+" di bawah 9 m².":"Semua kamar tidur minimal 9 m².");
  if(d.pts){
    if(d.kdbA!==null)push(d.cover<=d.kdbA?"ok":"bad","Tapak lantai 1 vs KDB "+f(num(r.kdb),0)+"%","Tapak "+f(d.cover,1)+" m² (termasuk carport), batas "+f(d.kdbA,1)+" m²."+est);
    else push("na","Tapak lantai 1 vs KDB","Isi KDB di tab Aturan daerah.");
    if(d.env)push(d.cover<=d.envArea?"ok":"bad","Muat di dalam garis sempadan","Area dalam GSB "+f(d.envArea,1)+" m², kebutuhan tapak "+f(d.cover,1)+" m²."+(d.cover>d.envArea?" Pertimbangkan 2 lantai atau kurangi tapak.":"")+est);
    else push("bad","Muat di dalam garis sempadan","GSB terlalu besar untuk lahan ini, tidak ada area terbangun tersisa.");
    if(d.klbA!==null)push(d.gfa+d.car<=d.klbA?"ok":"bad","Luas lantai total vs KLB "+f(num(r.klb),1),f(d.gfa+d.car,1)+" m² dari batas "+f(d.klbA,1)+" m²."+est);
    if(d.kdhA!==null){const open=d.area-d.cover;push(open>=d.kdhA?"ok":"bad","Sisa lahan untuk KDH "+f(num(r.kdh),0)+"%","Lahan tidak terbangun "+f(open,1)+" m², minimal hijau "+f(d.kdhA,1)+" m²."+est)}
  }

function optList(){if(!curId)return [];return Object.keys(opts).filter(id=>opts[id].pid===curId).map(id=>Object.assign({id},opts[id],optPending[id]||{})).sort((a,b)=>String(a.key).localeCompare(String(b.key)))}
function baseName(s){return String(s||"").toLowerCase().replace(/\(.*?\)/g,"").replace(/\s+\d+$/,"").replace(/\s+/g," ").trim()}
function progDiff(d,rv){if(!rv||!Array.isArray(rv.rooms))return null;const P={},M={};
  for(const r of d.rooms){if(r.kind==="carport")continue;const k=baseName(r.name);if(!P[k])P[k]={name:r.name,prog:0,model:0};P[k].prog+=(num(r.area)||0)*(num(r.qty)||0)}
  for(const r of rv.rooms){const k=baseName(r.name);const a=num(r.area)||0;if(P[k])P[k].model+=a;else{if(!M[k])M[k]={name:r.name,prog:0,model:0};M[k].model+=a}}
  const rows=Object.values(P).map(x=>Object.assign(x,{pct:x.prog?(x.model-x.prog)/x.prog*100:null}));
  const extra=Object.values(M);let maxAbs=0;let worst=null;
  for(const x of rows){const v=x.model===0?100:Math.abs(x.pct||0);if(v>maxAbs){maxAbs=v;worst=x}}
  return {rows,extra,maxAbs,worst,missing:rows.filter(x=>x.model===0)}}

  const base=gfa*price*(1+(floors>=2?(num(g.twoPct)||0)/100:0));const cp=(car||0)*price*(num(g.carPct)||0)/100;const sub=base+cp;const cont=sub*(num(g.contPct)||0)/100;
  return {base,cp,sub,cont,total:sub+cont,lo:(sub+cont)*0.9,hi:(sub+cont)*1.1}}
function optMetrics(p,d,o){const rv=optRv(o);
  const floors=rv&&num(rv.floors)?num(rv.floors):(num(o.floors)||d.floors);
  const gfa=rv&&num(rv.gfa)!==null?num(rv.gfa):null;const foot=rv&&num(rv.foot1)!==null?num(rv.foot1):null;const car=rv&&num(rv.carport)!==null?num(rv.carport):d.car;
  const cover=foot!==null?foot+car:null;const diff=progDiff(d,rv);
  const C=[];const push=(st,label,detail)=>C.push({st,label,detail});
  if(gfa!==null)push(gfa<=d.maxGfa?"ok":"bad","Luas bangunan",f(gfa,1)+" dari maks. "+f(d.maxGfa,0)+" m²");
  if(cover!==null&&d.kdbA!==null)push(cover<=d.kdbA?"ok":"bad","KDB",f(cover,1)+" dari maks. "+f(d.kdbA,1)+" m²");
  if(cover!==null&&d.env)push(cover<=d.envArea?"ok":"bad","Dalam GSB",f(cover,1)+" dari "+f(d.envArea,1)+" m²");

  h+='<div class="grid g2"><label class="f" for="on_'+o.id+'"><span>Nama opsi</span><input id="on_'+o.id+'" data-opt="'+o.id+'" data-of="name" value="'+esc(o.name||"")+'"></label><label class="f" for="of_'+o.id+'"><span>Jumlah lantai</span><select id="of_'+o.id+'" data-opt="'+o.id+'" data-of="floors"><option value="1"'+(num(o.floors)==1?" selected":"")+'>1 lantai</option><option value="2"'+(num(o.floors)==2?" selected":"")+'>2 lantai</option></select></label></div>';
  h+='<label class="f" for="ot_'+o.id+'"><span>Strategi massa dan zoning</span><textarea id="ot_'+o.id+'" data-opt="'+o.id+'" data-of="strategy" placeholder="mis. massa memanjang ke belakang, carport di sisi A, kamar di sisi timur, taman di sisi C–D">'+esc(o.strategy||"")+'</textarea></label>';
  h+='<div data-live="rv" data-id="'+o.id+'">'+rvHTML(d,o)+'</div>';
  h+=optDel===o.id?'<div class="confirm">Hapus Opsi '+esc(o.key)+'? Data model yang tercatat ikut terhapus.<div class="row"><button class="btn" type="button" data-act="opt-del-yes" data-id="'+o.id+'" style="color:var(--bad);border-color:var(--bad)">Hapus</button><button class="btn" type="button" data-act="opt-del-no">Batal</button></div></div>':'<div class="row"><button class="btn ghost" type="button" data-act="opt-del" data-id="'+o.id+'">Hapus opsi</button></div>';
  return h+'</div>'}
function cmpHTML(d,ol){if(!ol.length)return '<div class="note">Belum ada opsi.</div>';
  const ms=ol.map(o=>optMetrics(draft,d,o));const lab={ok:"Sesuai",warn:"Cek",bad:"Melanggar"};
  const cell=(m,label)=>{const c=m.checks.find(x=>x.label===label);return c?'<span class="pill '+c.st+'">'+lab[c.st]+'</span> <span class="num">'+esc(c.detail)+'</span>':'<span class="hint">–</span>'};
  const rows=[["Status",o=>esc((OSTAT.find(s=>s[0]===o.status)||["",""])[1])+(draft.design.choice&&draft.design.choice.id===o.id?' · <b>dipilih</b>':'')],
    ["Luas bangunan",(o,m)=>cell(m,"Luas bangunan")],["Tapak vs KDB",(o,m)=>cell(m,"KDB")],["Dalam GSB",(o,m)=>cell(m,"Dalam GSB")],["Lantai",(o,m)=>m.rv?cell(m,"Lantai"):'<span class="num">'+m.floors+' (rencana)</span>'],["Selisih program",(o,m)=>cell(m,"Selisih program")],
    ["Estimasi biaya",(o,m)=>m.cost?'<span class="num">'+rpj(m.cost.total)+'</span>'+(m.costFromModel?'':' <span class="hint">dari program</span>'):'–'],["Strategi",o=>'<small>'+esc(o.strategy||"–")+'</small>']];
  return '<div class="tw"><table><thead><tr><th></th>'+ol.map(o=>'<th>Opsi '+esc(o.key)+'<br><span style="text-transform:none;letter-spacing:0;font-family:var(--sans);font-weight:400">'+esc(o.name||"")+'</span></th>').join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr><td class="lbl">'+r[0]+'</td>'+ol.map((o,i)=>'<td>'+r[1](o,ms[i])+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>'}
function costBasis(d,ol){const ch=draft.design.choice;const o=ch?ol.find(x=>x.id===ch.id):null;const m=o?optMetrics(draft,d,o):null;
  if(m&&m.gfa!==null)return {gfa:m.gfa,car:m.car,floors:m.floors,label:(m.rv.src==="model"?"Octopus Model":"Model Revit (data lama)")+" Opsi "+o.key};
  return {gfa:d.gfa,car:d.car,floors:d.floors,label:"Program ruang (belum ada opsi terpilih yang dimodelkan)"}}
function costHTML(d,ol){const b=costBasis(d,ol);const c=costFor(draft,b.gfa,b.car,b.floors);const g=draft.design;
  if(!c)return '<div class="note">Luas bangunan belum ada.</div>';
  const bd=(g.bd||[]).map(num);const sumPct=bd.reduce((a,x)=>a+(x||0),0);

  h+='<p class="hint">Kisaran ±10%: '+rp(c.lo)+' – '+rp(c.hi)+'. Setara '+rp(c.total/b.gfa)+' per m² bangunan.</p>';
  h+='<div class="tw"><table><thead><tr><th>Pekerjaan</th><th class="r">%</th><th class="r">Nilai</th></tr></thead><tbody>'+BD.map((x,i)=>'<tr><td>'+x[0]+'</td><td class="r num">'+f(bd[i]||0,0)+'</td><td class="r num">'+rp(c.sub*(bd[i]||0)/100)+'</td></tr>').join("")+'</tbody><tfoot><tr><td>Subtotal sebelum kontingensi</td><td class="r num" style="color:'+(Math.abs(sumPct-100)>0.01?"var(--bad)":"inherit")+'">'+f(sumPct,0)+'</td><td class="r num">'+rp(c.sub)+'</td></tr></tfoot></table></div>'+(Math.abs(sumPct-100)>0.01?'<div class="note warn">Jumlah persentase pekerjaan '+f(sumPct,0)+'%, seharusnya 100%.</div>':'');
  return h}

  R+='<details><summary class="hint" style="cursor:pointer">Ubah proporsi pekerjaan</summary><div class="grid" style="margin-top:8px">'+BD.map((x,i)=>inp("design.bd."+i,x[0],{num:1,unit:"%"})).join("")+'</div></details>';
  R+='<div data-live="cost">'+costHTML(d,ol)+'</div></div>';

  R+='<div class="sec"><h3>Gerbang B · desain final</h3>';
  if(!gb.verifiedAt)R+='<div class="grid g2">'+chk("gates.B.clientOk","Klien menandatangani desain final")+'</div><div class="grid g2">'+inp("gates.B.clientDate","Tanggal tanda tangan",{ph:"mis. 14 Okt 2026"})+inp("gates.B.clientForm","Bentuk persetujuan",{ph:"tanda tangan lembar desain"})+'</div>'+area("gates.B.material","Material utama","struktur, dinding, atap, lantai, kusen")+area("gates.B.exception","Catatan pengecualian","bila selisih program > 10% tetap diterima")+'<div class="grid g2">'+area("gates.B.note","Catatan arsitek","")+inp("gates.B.by","Diverifikasi oleh",{ph:"nama arsitek"})+'</div>';
  R+='<div data-live="gateB">'+gateStatHTML(gateBState(draft,d,ol),"B",gb)+'</div></div></div>';
  return '<div class="panel">'+L+R+'</div>'}

/* ---------- modul 3: dokumentasi ---------- */
function curRab(){return curId?rabs[curId]||null:null}
function rabCalc(r){if(!r)return null;const groups=(r.groups||[]).map(g=>{const items=(g.items||[]).map(i=>Object.assign({},i,{total:(num(i.qty)||0)*(num(i.price)||0)}));return Object.assign({},g,{items,sub:items.reduce((a,i)=>a+i.total,0)})});
  const sub=groups.reduce((a,g)=>a+g.sub,0);const oh=sub*(num(r.overheadPct)||0)/100;const ppn=(sub+oh)*(num(r.ppnPct)||0)/100;return {groups,sub,oh,ppn,total:sub+oh+ppn}}
function rabSummary(d){const r=curRab();const c=rabCalc(r);if(!c)return '<div class="note">Belum ada RAB.</div>';
  const gfa=r.meta&&num(r.meta.gfa)||d.gfa;const car=r.meta&&num(r.meta.carport)||d.car;
  const ol=optList();const b=costBasis(d,ol);const est=costFor(draft,b.gfa,b.car,b.floors);
  let h='<div class="readout" style="border-top:1px solid var(--rule)"><div><span>Subtotal pekerjaan</span><b>'+rpj(c.sub)+'</b></div><div><span>Jasa kontraktor '+f(num(r.overheadPct)||0,0)+'%</span><b>'+rpj(c.oh)+'</b></div><div><span>PPN '+f(num(r.ppnPct)||0,0)+'%</span><b>'+rpj(c.ppn)+'</b></div><div><span>Total RAB</span><b>'+rpj(c.total)+'</b></div></div>';
  h+='<p class="hint">Setara '+rp(c.total/gfa)+' per m² luas bangunan ('+f(gfa,1)+' m²). '+(est?'Estimasi modul 2: '+rpj(est.total)+' ('+(c.total>est.total?'+':'')+f((c.total-est.total)/est.total*100,0)+'%).':'')+'</p>';
  const max=Math.max(...c.groups.map(g=>g.sub),1);
  h+='<div class="tw"><table><tbody>'+c.groups.map(g=>'<tr><td class="lbl">'+esc(g.code)+'</td><td>'+esc(g.name)+'<div style="height:6px;margin-top:3px;background:var(--accent-soft)"><div style="height:6px;width:'+(g.sub/max*100).toFixed(1)+'%;background:var(--accent)"></div></div></td><td class="r num">'+rpj(g.sub)+'</td><td class="r num">'+f(g.sub/c.sub*100,1)+'%</td></tr>').join("")+'</tbody></table></div>';
  return h}
function rabTable(){const r=curRab();if(!r)return '<div class="note">Belum ada RAB untuk proyek ini. Susun dari model dengan tombol "Susun RAB dari model" di tab 07.</div><div class="row" style="margin-top:8px"><button class="btn pri" type="button" data-goto="model">Ke tab Model</button></div>';
  let h='<div class="tw"><table><thead><tr><th>No.</th><th>Uraian pekerjaan</th><th class="r">Volume</th><th>Sat.</th><th class="r">Harga satuan (Rp)</th><th class="r">Jumlah (Rp)</th></tr></thead><tbody>';
  (r.groups||[]).forEach((g,gi)=>{let sub=0;h+='<tr><td class="lbl"><b>'+esc(g.code)+'</b></td><td colspan="5"><b>'+esc(g.name)+'</b></td></tr>';
    (g.items||[]).forEach((it,ii)=>{const t=(num(it.qty)||0)*(num(it.price)||0);sub+=t;
      h+='<tr><td class="lbl">'+esc(g.code)+'.'+(ii+1)+'</td><td>'+esc(it.name)+(it.src?'<div class="hint" style="font-size:11px">'+esc(it.src)+'</div>':'')+'</td><td style="width:92px"><input class="num" inputmode="decimal" id="rq_'+gi+'_'+ii+'" data-rab="'+gi+'.'+ii+'" data-f="qty" value="'+esc(fv(it.qty))+'"></td><td>'+esc(it.unit)+'</td><td style="width:130px"><input class="num" inputmode="decimal" id="rp_'+gi+'_'+ii+'" data-rab="'+gi+'.'+ii+'" data-f="price" value="'+esc(fv(it.price))+'"></td><td class="r num" id="rt_'+gi+'_'+ii+'">'+f(t,0)+'</td></tr>'});
    h+='<tr><td></td><td colspan="4" class="hint">Subtotal '+esc(g.code)+'</td><td class="r num" id="rs_'+gi+'"><b>'+f(sub,0)+'</b></td></tr>'});
  return h+'</tbody></table></div>'}
function pbgSummary(){const p=draft.pbg||{};const cnt={belum:0,proses:0,siap:0,na:0};PBG.forEach(x=>{const s=(p[x[2]]||{}).st||"belum";cnt[s]++});const need=PBG.length-cnt.na;
  return '<div class="tally"><span class="pill ok">'+cnt.siap+' siap</span><span class="pill warn">'+cnt.proses+' disiapkan</span><span class="pill na">'+cnt.belum+' belum</span></div><p class="hint">'+cnt.siap+' dari '+need+' berkas yang diperlukan sudah siap. Cocokkan daftar ini dengan persyaratan di SIMBG Kota Tangerang Selatan sebelum mengunggah.</p>'}
function tabDok(d){

  L+=rabTable();
  if(r)L+='<div class="row"><button class="btn pri" type="button" data-act="rab-xlsx"'+(downloads&&window.XLSX?"":" disabled")+'>Unduh RAB (Excel)</button><button class="btn" type="button" data-act="rab-copy">Salin tabel</button><span class="hint" id="rabmsg" style="margin:0">'+(downloads?"":"Unduhan tersedia saat halaman dibuka di Claude.")+'</span></div>';
  L+='</div></div>';
  let R='<div class="col"><div class="sec"><h3>Ringkasan biaya</h3><div data-live="rabsum">'+rabSummary(d)+'</div></div>';
  R+='<div class="sec"><h3>Berkas PBG (SIMBG)</h3><div data-live="pbgsum">'+pbgSummary()+'</div><div class="checks">';

    const v=(draft.pbg||{})[x[2]]||{};const st=v.st||"belum";
    R+='<div class="ck" style="grid-template-columns:132px 1fr"><select id="pbg_'+x[2]+'" data-pbg="'+x[2]+'" aria-label="Status '+esc(x[3])+'">'+PBG_ST.map(s=>'<option value="'+s[0]+'"'+(s[0]===st?" selected":"")+'>'+s[1]+'</option>').join("")+'</select><div><b>'+esc(x[3])+'</b>'+(x[4]?'<small>'+esc(x[4])+'</small>':'')+'<input id="pbgn_'+x[2]+'" data-pbgnote="'+x[2]+'" value="'+esc(v.note||"")+'" placeholder="Catatan, nomor dokumen, lokasi file" style="margin-top:4px;font-size:12.5px"></div></div>'});
  R+='</div><p class="hint">Daftar mengacu pada persyaratan umum PBG rumah tinggal. Persyaratan akhir mengikuti SIMBG dan Dinas Cipta Karya setempat.</p></div></div>';
  return '<div class="panel dokp">'+L+R+'</div>'}
function rabSave(){clearTimeout(rabTimer);rabTimer=setTimeout(async()=>{const r=curRab();if(!r||mode!=="db")return;rabDirty=false;
  try{await db.doc("rab/"+curId).update({groups:r.groups,overheadPct:num(r.overheadPct),ppnPct:num(r.ppnPct),editedAt:Date.now()});setSave("Tersimpan otomatis.")}catch(e){setSave("Gagal menyimpan RAB.")}},700)}
function rabRows(){const r=curRab();const c=rabCalc(r);const rows=[["RENCANA ANGGARAN BIAYA"],[draft.name+" · "+(draft.address||"")],[r.basis||""],[],["No.","Uraian pekerjaan","Volume","Satuan","Harga satuan (Rp)","Jumlah (Rp)","Sumber volume"]];
  c.groups.forEach(g=>{rows.push([g.code,g.name]);g.items.forEach((i,ii)=>rows.push([g.code+"."+(ii+1),i.name,num(i.qty),i.unit,num(i.price),Math.round(i.total),i.src||""]));rows.push(["","Subtotal "+g.code,"","","",Math.round(g.sub)])});
  rows.push([]);rows.push(["","Jumlah pekerjaan","","","",Math.round(c.sub)]);rows.push(["","Jasa kontraktor "+(num(r.overheadPct)||0)+"%","","","",Math.round(c.oh)]);rows.push(["","PPN "+(num(r.ppnPct)||0)+"%","","","",Math.round(c.ppn)]);rows.push(["","TOTAL","","","",Math.round(c.total)]);rows.push(["","Dibulatkan","","","",Math.round(c.total/1e5)*1e5]);return rows}
async function rabXlsx(){const m=$("#rabmsg");try{const ws=XLSX.utils.aoa_to_sheet(rabRows());ws["!cols"]=[{wch:7},{wch:48},{wch:10},{wch:7},{wch:16},{wch:17},{wch:40}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"RAB");const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  const name="RAB_"+(draft.name||"proyek").replace(/[^\w\-]+/g,"_")+".xlsx";await downloads.save({filename:name,data:new Blob([buf])});m.textContent="File Excel diunduh."}
  catch(e){m.textContent=e&&e.code==="declined"?"Unduhan dibatalkan.":e&&e.code==="rate_limited"?"Tunggu sebentar lalu coba lagi.":"Unduhan tidak tersedia di tampilan ini. Pakai Salin tabel."}}
async function rabCopy(){const t=rabRows().map(r=>r.join("\t")).join("\n");const m=$("#rabmsg");try{await navigator.clipboard.writeText(t);m.textContent="Tabel tersalin, tempel ke Excel."}catch(e){m.textContent="Tidak bisa menyalin di tampilan ini."}}

function inp(k,label,opt){opt=opt||{};const v=getP(draft,k);const id=fid(k);const isNum=opt.num;
  const field='<input id="'+id+'" data-k="'+k+'"'+(isNum?' data-num="1" class="num" inputmode="decimal"':'')+' value="'+esc(isNum?fv(v):(v??""))+'"'+(opt.ph?' placeholder="'+esc(opt.ph)+'"':'')+'>';

/* ---------- markdown ---------- */
function inl(s){return s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>")}
function md(src){const lines=esc(src).split(/\r?\n/);let h="",list=null,tbl=[];
  const flushL=()=>{if(list){h+="</"+list+">";list=null}};const flushT=()=>{if(tbl.length){const rows=tbl.filter(r=>!/^\|?[\s:|-]+\|?$/.test(r));const cells=r=>r.replace(/^\||\|$/g,"").split("|").map(c=>inl(c.trim()));
    h+='<div class="tw"><table>'+rows.map((r,i)=>"<tr>"+cells(r).map(c=>i===0?"<th>"+c+"</th>":"<td>"+c+"</td>").join("")+"</tr>").join("")+"</table></div>";tbl=[]}};
  for(const raw of lines){const l=raw.trimEnd();
    if(/^\s*\|/.test(l)){flushL();tbl.push(l.trim());continue}else flushT();
    let m;
    if(m=l.match(/^(#{1,3})\s+(.*)/)){flushL();const lv=m[1].length;h+="<h"+lv+">"+inl(m[2])+"</h"+lv+">";continue}
    if(m=l.match(/^\s*[-*]\s+(.*)/)){if(list!=="ul"){flushL();h+="<ul>";list="ul"}h+="<li>"+inl(m[1])+"</li>";continue}
    if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=="ol"){flushL();h+="<ol>";list="ol"}h+="<li>"+inl(m[1])+"</li>";continue}
    flushL();if(l.trim())h+="<p>"+inl(l)+"</p>"}
  flushL();flushT();return h}

/* geometri */
const mLen=w=>Math.hypot(w.b[0]-w.a[0],w.b[1]-w.a[1]);
function mDir(w){const L=mLen(w)||1;return [(w.b[0]-w.a[0])/L,(w.b[1]-w.a[1])/L]}
function mProj(p,w){const L=mLen(w)||1e-9,u=mDir(w);const t=(p[0]-w.a[0])*u[0]+(p[1]-w.a[1])*u[1];const tc=Math.max(0,Math.min(L,t));const q=[w.a[0]+u[0]*tc,w.a[1]+u[1]*tc];return {t:tc,raw:t,dist:Math.hypot(q[0]-p[0],q[1]-p[1]),q,u,L}}
function pArea(pts){let s=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];s+=a[0]*b[1]-b[0]*a[1]}return s/2}
function pPerim(pts){let s=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];s+=Math.hypot(b[0]-a[0],b[1]-a[1])}return s}
function inPoly(p,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const a=pts[i],b=pts[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1]+1e-12)+a[0])c=!c}return c}
function pCent(pts){const A=pArea(pts);if(Math.abs(A)<1e-6){return [pts.reduce((s,q)=>s+q[0],0)/pts.length,pts.reduce((s,q)=>s+q[1],0)/pts.length]}let cx=0,cy=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length],c=a[0]*b[1]-b[0]*a[1];cx+=(a[0]+b[0])*c;cy+=(a[1]+b[1])*c}return [cx/(6*A),cy/(6*A)]}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1e-12;let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2;t=Math.max(0,Math.min(1,t));return Math.hypot(a[0]+dx*t-p[0],a[1]+dy*t-p[1])}
function mRect(s){return [Math.min(s.a[0],s.b[0]),Math.min(s.a[1],s.b[1]),Math.max(s.a[0],s.b[0]),Math.max(s.a[1],s.b[1])]}
const r2=v=>Math.round(v*100)/100,r3=v=>Math.round(v*1000)/1000;
function mElev(m,id){let e=0;for(const l of m.levels){if(l.id===id)return e;e+=num(l.h)||3}return e}
function mLvl(m,id){return m.levels.find(l=>l.id===id)}

  if(type==="datar"||!(W>0&&D>0))return {flat:true,type:"datar",W,D,x0,y0,x1,y1,plan:W*D,sloped:W*D,ridge:0,hips:0,eave:2*(W+D),rise:0,lines:[],faces:[]};
  const rot=D>W,L=rot?D:W,B=rot?W:D;const rise=B/2*Math.tan((num(s.slope)||30)*Math.PI/180);const rh=type==="pelana"?L/2:Math.max(0,L/2-B/2);
  const map=p=>rot?[xc-p[1],yc+p[0],p[2]]:[xc+p[0],yc+p[1],p[2]];
  const [P0,P1,P2,P3,R0,R1]=[[-L/2,-B/2,0],[L/2,-B/2,0],[L/2,B/2,0],[-L/2,B/2,0],[-rh,0,rise],[rh,0,rise]].map(map);
  const faces=[[P0,P3,P2,P1],[P0,P1,R1,R0],[P1,P2,R1],[P2,P3,R0,R1],[P3,P0,R0]];
  const lines=[[R0,R1]];if(type==="perisai")lines.push([P0,R0],[P3,R0],[P1,R1],[P2,R1]);
  return {flat:false,type,W,D,x0,y0,x1,y1,plan:W*D,sloped:W*D*Math.sqrt(1+Math.pow(2*rise/B,2)),ridge:2*rh,hips:type==="perisai"?4*Math.hypot(B/2,B/2,rise):0,eave:type==="perisai"?2*(W+D):2*L+4*Math.hypot(B/2,rise),rise,lines,faces}}

/* kuantitas */
function mQty(m){const q={hasContent:!!(m.walls.length||m.rooms.length||m.slabs.length||m.cols.length)};const L0=m.levels[0]&&m.levels[0].id;
  const byType={};let wl=0,wg=0,wn=0,wl1=0,ext=0;const lvWallLen={};

    const rs=roomsOn(w.levelId).filter(r=>!isOut(r.name)&&r.pts.length>=3);const u=mDir(w),nn=[-u[1],u[0]],off=(num(w.t)||.15)/2+0.15;let faces=0;
    for(const sgn of[1,-1]){let inside=false;for(const f of[.25,.5,.75]){const p=[w.a[0]+(w.b[0]-w.a[0])*f+nn[0]*off*sgn,w.a[1]+(w.b[1]-w.a[1])*f+nn[1]*off*sgn];if(rs.some(r=>inPoly(p,r.pts))){inside=true;break}}if(!inside)faces++}
    if(!rs.length)faces=1;ext+=Math.min(faces,2)*net}
  Object.assign(q,{wallLen:wl,wallLen1:wl1,wallGross:wg,wallNet:wn,byType,extFace:ext,lvWallLen});
  q.rooms=m.rooms.filter(r=>r.pts&&r.pts.length>=3).map(r=>({id:r.id,levelId:r.levelId,name:r.name||"Ruang",area:Math.abs(pArea(r.pts)),perim:pPerim(r.pts),finish:r.finish||defFinish(r.name),ceil:r.ceil!==undefined?!!r.ceil:defCeil(r.name)}));

  else if(a==="del-no"){confirmDel=false;renderSide()}
  else if(a==="del-yes")deleteProject();
  else if(a==="side-add"){s.sides.push(null);while(s.diags.length<s.sides.length-3)s.diags.push(null);scheduleSave();renderMain()}
  else if(a==="side-del"){s.sides.pop();s.diags=s.diags.slice(0,Math.max(0,s.sides.length-3));if((s.roadEdge|0)>=s.sides.length)s.roadEdge=0;scheduleSave();renderMain()}
  else if(a==="diag-solve"){const c=num(s.certArea);if(!c){alertIn("Isi luas di sertifikat dulu.");return}const e2=solveDiag(s.sides.map(num),c);if(!e2){alertIn("Sisi dan luas sertifikat tidak cocok untuk membentuk segiempat. Cek ulang ukurannya.");return}s.diags=[Math.round(e2*100)/100];scheduleSave();renderMain()}
  else if(a==="pt-add"){s.coords.push({x:null,y:null});scheduleSave();renderMain()}
  else if(a==="pt-del"){s.coords.pop();scheduleSave();renderMain()}
  else if(a==="read-plan")readPlan();
  else if(a==="use-plan")usePlan();
  else if(a==="drop-plan"){readResult=null;$("#readout-ai").innerHTML=""}
  else if(a==="rule-ai")ruleAI();
  else if(a==="rule-save")ruleSave();
  else if(a==="rule-use")ruleUse();
  else if(a==="room-add"){draft.rooms.push({name:"Ruang baru",area:9,qty:1,floor:1,kind:"umum"});scheduleSave();renderMain()}
  else if(a==="room-del"){draft.rooms.splice(+b.dataset.i,1);scheduleSave();renderMain()}
  else if(a==="room-auto"){draft.roomsAuto=true;draft.rooms=[];scheduleSave();renderMain()}
  else if(a==="report")report();
  else if(a==="report-stop"){chatCtl&&chatCtl.abort()}
  else if(a==="report-copy")copyReport();
  else if(a==="photo-up")uploadPhotos();
  else if(a==="photo-del")delPhoto(+b.dataset.i);
  else if(a==="gate-verify")verifyGate(b.dataset.g);
  else if(a==="gate-reopen")reopenGate(b.dataset.g);
  else if(a==="opt-add")addOpt();
  else if(a==="opt-del"){optDel=b.dataset.id;renderMain()}
  else if(a==="opt-del-no"){optDel=null;renderMain()}
  else if(a==="opt-del-yes")delOpt(b.dataset.id);
  else if(a==="choose")choose();
  else if(a==="rab-xlsx")rabXlsx();
  else if(a==="rab-copy")rabCopy();
  else if(a==="drw-pdf")drwPDF();
  else if(a==="drw-svg")drwSVG();
  else if(a==="proj-export")projExport();
  else if(a==="drw-dxf")drwDXF(false);
  else if(a==="drw-dxf-all")drwDXF(true);
  else if(a==="opt-src"){optSet(b.dataset.id,"src",b.dataset.v);if(opts[b.dataset.id])opts[b.dataset.id].src=b.dataset.v;renderMain()}
  else if(a==="to-model"){flushOpts();ME.opt=b.dataset.id;tab="model";renderMain()}
  else if(a==="auto-model"){flushOpts();ME.opt=b.dataset.id;AUTO.pending=true;tab="model";renderMain()}
});
function alertIn(t){const el=document.querySelector('[data-live="err"]');if(el)el.innerHTML='<div class="note warn">'+esc(t)+'</div>'}
document.addEventListener("keydown",e=>{const t=e.target;if(mKey(e))return;if(t.getAttribute&&t.getAttribute("role")==="tab"&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const i=TABS.findIndex(x=>x[0]===tab);const ni=(i+(e.key==="ArrowRight"?1:TABS.length-1))%TABS.length;tab=TABS[ni][0];renderMain();const nb=document.querySelector('[data-tab="'+tab+'"]');nb&&nb.focus()}});
window.addEventListener("beforeunload",()=>{flush();flushOpts();mFlush()});

/* ---------- boot ---------- */
function startLocal(){mode="local";const id="contoh";projects={[id]:Object.assign(clone(SAMPLE),{updatedAt:Date.now()})};openProject(id)}
function startDb(){mode="db";renderSide();
  db.collection("projects").onSnapshot(snap=>{const next={};snap.docs.forEach(x=>{next[x.id]=x.data()});projects=next;
    if(curId&&!projects[curId]&&!dirty){curId=null;draft=null}
    if(!curId){const ids=Object.keys(projects).sort((a,b)=>(projects[b].updatedAt||0)-(projects[a].updatedAt||0));if(ids[0]){openProject(ids[0]);return}renderSide();renderTB();renderMain();return}
    if(!dirty){const inc=migrate(clone(projects[curId]));if(stable(inc)!==stable(draft)){draft=inc;renderMain();renderTB()}}
    renderSide()},err=>{setSave("Koneksi data terputus. Muat ulang halaman.")});
  db.collection("opsi").onSnapshot(snap=>{const next={};snap.docs.forEach(x=>{next[x.id]=clone(x.data())});opts=next;
    if(tab!=="desain"&&tab!=="hasil"||!draft)return;
    const a=document.activeElement;if(a&&a.closest&&a.closest("#main")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))refresh();else renderMain()},()=>{});
  db.collection("rab").onSnapshot(snap=>{if(rabDirty)return;const next={};snap.docs.forEach(x=>{next[x.id]=clone(x.data())});rabs=next;
    if(tab!=="dok"||!draft)return;const a=document.activeElement;if(a&&a.closest&&a.closest("#main")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))refresh();else renderMain()},()=>{});
  db.collection("model").onSnapshot(snap=>{const next={};snap.docs.forEach(x=>{next[x.id]=x.data()});models=next;
    if(Mid&&M&&!mDirty&&!ME.drag&&!ME.start&&next[Mid]){const inc=mNorm(clone(next[Mid]));if(stable(inc)!==stable(M)){M=inc;if(!mLvl(M,ME.lvl))ME.lvl=M.levels[0].id;if(tab==="model"&&mCanvas&&mCanvas.isConnected){mUI();mDraw();mBuild3()}}}
    if(draft&&(tab==="desain"||tab==="dok")){const a=document.activeElement;if(a&&a.closest&&a.closest("#main")&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))refresh();else renderMain()}},()=>{});
  db.collection("aturan").onSnapshot(snap=>{rules=snap.docs.map(x=>x.data()).sort((a,b)=>(a.region+a.district).localeCompare(b.region+b.district));if(tab==="aturan"&&draft&&!document.activeElement.closest("#main"))renderMain()},()=>{})}
renderTB();renderSide();
db=window.OCTO.db;downloads=window.OCTO.downloads;
if(window.OCTO.isEmpty()){const p=migrate(clone(SAMPLE));p.createdAt=p.updatedAt=Date.now();db.doc("projects/contoh").set(p)}
startDb();
})();
</script>
